name: Test

on:
  push:
    branches: [main, develop, 'release/*', 'hotfix/*', 'support/*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift ${{ matrix.swift-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-26]
        swift-version: ['6.0', '6.1', '6.2', '6.3']
    steps:
      - uses: actions/checkout@v4

      - name: Install swiftly and Swift (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz > swiftly.tar.gz
          tar zxf swiftly.tar.gz
          ./swiftly init --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          swiftly install ${{ matrix.swift-version }} --post-install-file=post-install.sh
          if [ -f post-install.sh ]; then
            sudo bash post-install.sh
          fi
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Install swiftly and Swift (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L https://download.swift.org/swiftly/darwin/swiftly.pkg > swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swiftly install ${{ matrix.swift-version }} --post-install-file=post-install.sh
          if [ -f post-install.sh ]; then
            . post-install.sh
          fi
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve ${RUNNER_DEBUG:+-v}

      - name: Build
        run: swift build ${RUNNER_DEBUG:+-v}

      - name: Test
        run: swift test ${RUNNER_DEBUG:+-v}
